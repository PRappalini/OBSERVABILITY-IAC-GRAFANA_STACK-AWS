apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://PROMETHEUS_PRIVATE_IP:9090
    isDefault: true
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://LOKI_PRIVATE_IP:3100
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://TEMPO_PRIVATE_IP:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
      serviceMap:
        datasourceUid: prometheus
